    const vis = [meshes.solid.visible, meshes.shards.visible, meshes.embers.visible]; meshes.solid.visible = meshes.shards.visible = meshes.embers.visible = true;
    director.evaluate(0, camera.position, camTgt); camera.lookAt(camTgt); camera.updateMatrixWorld();
    await renderer.compileAsync(scene, camera);
    ShardSystem.mesh.material = ShardSystem.shardMatTiled; await renderer.compileAsync(scene, camera); ShardSystem.mesh.material = ShardSystem.shardMat;
    [meshes.solid.visible, meshes.shards.visible, meshes.embers.visible] = vis;
  });
  await step(0.88, 'Waiting for sunset…', () => { for (const tt of [0.5, 4.5, 6.5, 16.0, 23.0, 29.5, 33.2]) { app.forceT = tt; tick(performance.now()); } app.forceT = null; app.t = 0; });
  last = performance.now();
  tick(last);
  requestAnimationFrame(frame);
  Loader.set(1, 'Ready.');
  const loadMs = performance.now() - tStart;
  if (CAPTURE) setupCapture();

  // ---- 3.4 capture mode (?capture[&size=1080x1920&start=6&format=png]): a fixed 1/60 s story step, HUD and chip
  // hidden, High tier locked, deterministic drift. Records exactly one cycle from any start time — as a video
  // (canvas.captureStream + MediaRecorder, paced in real time since the recorder timestamps by wall clock) or as a
  // frame-exact PNG sequence (into a folder via the File System Access API where available, else one download per frame).
  function setupCapture() {
    document.body.classList.add('capture'); ui.forceHidden = true; ui.chip.classList.add('gone');
    const $ = (id) => document.getElementById(id), sizeSel = $('cap-size'), startIn = $('cap-start'), fmtSel = $('cap-fmt'), go = $('cap-go'), status = $('cap-status');
    const q = new URLSearchParams(location.search);
    if (q.get('size')) sizeSel.value = q.get('size');
    if (q.get('start')) startIn.value = q.get('start');
    if (q.get('format')) fmtSel.value = q.get('format');
    const applySize = () => { app.capSize = sizeSel.value.split('x').map(Number); app.resize(); };
    sizeSel.addEventListener('change', applySize); applySize();
    const save = (blob, name) => { const a = document.createElement('a'), url = URL.createObjectURL(blob); a.href = url; a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(url), 4000); };
    const waitUntil = (at) => new Promise((r) => setTimeout(r, Math.max(0, at - performance.now())));
    const record = async ({ format = fmtSel.value, start = +startIn.value || 0, frames: nMax, dryRun = false } = {}) => {
      if (app.capturing) return null;
      const frames = Math.min(nMax || Infinity, Math.round(CONFIG.cycleDuration * 60)), t0 = clamp(start, 0, CONFIG.cycleDuration - 1e-3) / CONFIG.cycleDuration, stepT = 1 / (60 * CONFIG.cycleDuration);
      const [W, H] = app.capSize, wasPlaying = app.playing;
      app.capturing = true; app.playing = false; go.disabled = true; document.body.classList.add('recording');
      const frameAt = (i) => { app.t = (t0 + i * stepT) % 1; tick(performance.now(), 0); };
      let result = null;
      try {
        if (format === 'png') {
          let dir = null, bytes = 0;
          if (!dryRun && window.showDirectoryPicker) { try { dir = await window.showDirectoryPicker({ mode: 'readwrite' }); } catch (e) { status.textContent = 'cancelled'; return null; } }
          for (let i = 0; i < frames; i++) {
            frameAt(i);
            const blob = await new Promise((r) => renderer.domElement.toBlob(r, 'image/png'));
            const name = `obsidian_${W}x${H}_${String(i).padStart(5, '0')}.png`;
            bytes += blob.size;
            if (dryRun) { /* measured only */ } else if (dir) { const fh = await dir.getFileHandle(name, { create: true }), w = await fh.createWritable(); await w.write(blob); await w.close(); } else save(blob, name);
            if ((i & 7) === 0) status.textContent = `PNG ${i + 1} / ${frames}`;
          }
          result = { format, frames, bytes };
        } else {
          const stream = renderer.domElement.captureStream(0), track = stream.getVideoTracks()[0];
          const mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm', 'video/mp4'].find((m) => window.MediaRecorder && MediaRecorder.isTypeSupported(m));
          if (!mime) { status.textContent = 'MediaRecorder unavailable — use PNG'; return null; }
          const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 40e6 }), chunks = [];
          rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
          const stopped = new Promise((r) => (rec.onstop = r));
          rec.start(1000);
          const t = performance.now(); let late = 0;
          for (let i = 0; i < frames; i++) {
            const due = t + (i * 1000) / 60;
            await waitUntil(due);
            if (performance.now() - due > 8) late++;
            frameAt(i); track.requestFrame();
            if ((i & 15) === 0) status.textContent = `REC ${(i / 60).toFixed(1)} / ${(frames / 60).toFixed(1)} s`;
          }
          await waitUntil(t + (frames * 1000) / 60 + 60);
          rec.stop(); await stopped; track.stop();
          const blob = new Blob(chunks, { type: mime });
          if (!dryRun) save(blob, `obsidian_${W}x${H}.${mime.includes('mp4') ? 'mp4' : 'webm'}`);
          result = { format, frames, bytes: blob.size, mime, late };
        }
        status.textContent = `done — ${result.frames} frames${result.late ? `, ${result.late} late` : ''}`;
        return result;
      } finally {
        app.capturing = false; app.playing = wasPlaying; go.disabled = false; document.body.classList.remove('recording'); last = performance.now();
      }
    };
    go.addEventListener('click', () => record());
    app.record = record;
  }

  // ---- debug hooks (?debug). They work while rAF is throttled: __obs.shot(sec) renders that STORY second into an
  // overlay image; __obs.sheet([secs]) builds a labelled contact sheet; __obs.clear() removes it. Story seconds are
  // pinned through app.forceT, so they reach passages the edit cuts out; __obs.grid(list, cols, w, { real: true })
  // takes real seconds of the edit instead (with the edit's speed, as the viewer sees it)
  const loadImg = (img, src) => new Promise((r) => { img.onload = r; img.src = src; setTimeout(r, 400); });
  const overlay = () => {
    let img = document.getElementById('__ov');
    if (!img) { img = document.createElement('img'); img.id = '__ov'; img.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;z-index:100;pointer-events:none;object-fit:contain;background:#000'; document.body.appendChild(img); }
    return img;
  };
  const shotFn = async (sec) => {
    app.playing = false; app.forceT = sec; tick(performance.now(), 0); tick(performance.now(), 0);
    const img = overlay(); await loadImg(img, renderer.domElement.toDataURL('image/jpeg', 0.9)); return img;
  };
  const sheet = async (secs, cols = 3) => {
    const rows = Math.ceil(secs.length / cols), cw = 480, chh = 270, cv = document.createElement('canvas'); cv.width = cw * cols; cv.height = chh * rows;
    const x = cv.getContext('2d'); x.font = 'bold 18px system-ui'; x.fillStyle = '#0f0';
    for (let i = 0; i < secs.length; i++) { const img = await shotFn(secs[i]); const cx = (i % cols) * cw, cy = Math.floor(i / cols) * chh; x.drawImage(img, cx, cy, cw, chh); x.fillText(secs[i].toFixed(2) + ' s', cx + 8, cy + 22); }
    await loadImg(overlay(), cv.toDataURL('image/jpeg', 0.85)); return secs.length;
  };
  const clearOv = () => { const o = document.getElementById('__ov'); if (o) o.remove(); app.forceT = null; app.playing = true; };
  // __obs.grid([sec | [sec, label, fn, undo]], cols) — a contact sheet at the canvas's own aspect (for reviews)
  const grid = async (list, cols = 3, w = 426, { real = false } = {}) => {
    const h = Math.round((w * renderer.domElement.height) / renderer.domElement.width), rows = Math.ceil(list.length / cols), cv = document.createElement('canvas');
    cv.width = cols * w; cv.height = rows * h; const x = cv.getContext('2d'); x.font = 'bold 13px system-ui'; x.fillStyle = '#0f0';
    for (let i = 0; i < list.length; i++) {
      const [sec, label, fn, undo] = Array.isArray(list[i]) ? list[i] : [list[i]];
      app.playing = false;
      if (real) { app.forceT = null; app.t = sec / CONFIG.cycleDuration; } else app.forceT = sec;
      if (fn) fn();
      tick(performance.now(), 0);
      x.drawImage(renderer.domElement, (i % cols) * w, Math.floor(i / cols) * h, w, h); x.fillText(sec + ' ' + (label || ''), (i % cols) * w + 5, Math.floor(i / cols) * h + 15);
      if (undo) undo();
    }
    await loadImg(overlay(), cv.toDataURL('image/jpeg', 0.9)); return list.length;
  };
  // __obs.crop(sec, fx, fy, fw, fh) — render one second and blow up a region (fractions of the frame) into the overlay
  const crop = async (sec, fx = 0, fy = 0, fw = 1, fh = 1, w = 1200) => {
    app.playing = false; app.forceT = sec; tick(performance.now(), 0); tick(performance.now(), 0);
    const src = renderer.domElement, cv = document.createElement('canvas');
    cv.width = w; cv.height = Math.round((w * fh * src.height) / (fw * src.width));
    cv.getContext('2d').drawImage(src, fx * src.width, fy * src.height, fw * src.width, fh * src.height, 0, 0, cv.width, cv.height);
    await loadImg(overlay(), cv.toDataURL('image/jpeg', 0.92)); return [cv.width, cv.height];
  };
  const review = () => { document.getElementById('hud').classList.add('force-hidden'); ui.forceHidden = true; ui.chip.classList.add('gone'); };
  // render cycle second T (paused, no drift / grain / HUD unless asked) and return its pixels (downscaled RGBA)
  const grabPixels = (T, { w = 480, drift = 0 } = {}) => {
    app.driftK = drift; app.forceT = T; tick(performance.now(), 0); tick(performance.now(), 0);
    const src = renderer.domElement, h = Math.round((w * src.height) / src.width), cv = document.createElement('canvas');
    cv.width = w; cv.height = h; const x = cv.getContext('2d'); x.drawImage(src, 0, 0, w, h);
    return x.getImageData(0, 0, w, h).data;
  };
  const withChecks = (fn) => {
    const saved = [app.t, app.forceT, app.playing, app.driftK, PostFX.gradeMat.uniforms.uGrain.value, ui.forceHidden];
    app.playing = false; app.checking = true; ui.forceHidden = true; PostFX.gradeMat.uniforms.uGrain.value = 0;
    try { return fn(); } finally { [app.t, app.forceT, app.playing, app.driftK, PostFX.gradeMat.uniforms.uGrain.value, ui.forceHidden] = saved; app.checking = false; app.forceSwap = null; }
  };
  const diff = (a, b) => {
    let sum = 0, mx = 0, over = 0; const n = a.length / 4;
    for (let i = 0; i < a.length; i += 4) { const d = (Math.abs(a[i] - b[i]) + Math.abs(a[i + 1] - b[i + 1]) + Math.abs(a[i + 2] - b[i + 2])) / 3; sum += d; if (d > mx) mx = d; if (d > 8) over++; }
    return { mean: +(sum / n).toFixed(3), max: +mx.toFixed(1), over8: +((100 * over) / n).toFixed(3) + '%' };
  };
  // 3.5 — the loop seam: T = 0 against T = 35.999 with drift frozen and grain off → mean absolute pixel difference (0–255)
  const loopCheck = (T1 = 35.999) => withChecks(() => ({ T0: 0, T1, ...diff(grabPixels(0), grabPixels(T1)) }));
  // 2.1 — the solid ↔ shard swap: the same T rendered with the solid and with the (tiled) shards
  const swapCheck = (T) => withChecks(() => { app.forceSwap = 'solid'; const a = grabPixels(T); app.forceSwap = 'shards'; const b = grabPixels(T); return { T, ...diff(a, b) }; });
  // 1.3 — every shard's clearance of the flat, per flight phase: min of pos.y − scale·g·0.6 (and where / when)
  const PHASES = ['tiled', 'burst', 'vortex', 'murmuration', 'cathedral', 'flock', 'whale', 'spray', 'spiral', 'column', 'lock'];
  // the state pass alone at story time T, with the uniforms and camera a real frame would have
  const stateAt = (T) => {
    app.forceT = T; Story.apply(T / NOMINAL, meshes); U.uRate.value = 1;
    director.evaluate(T, camPos, camTgt); U.uCamPos.value.copy(camPos);
    const Tp = T - VEL_DT, cut = (Tp < B('shatter') && T >= B('shatter')) || (Tp < B('emerge') && T >= B('emerge'));
    director.evaluate(cut ? T : (Tp + NOMINAL) % NOMINAL, prevPos, prevTgt); U.uCamPosPrev.value.copy(prevPos);
    ShardSystem.update(renderer, true);
  };
  const floorCheck = (t0 = 0, t1 = 36, step = 0.05, { net = false } = {}) => withChecks(() => {
    const b = ShardSystem.bundle, N = b.count, R = b.tg.R, g = b.grid.g, P = new Float32Array(TEXW * R * 4), Vb = new Float32Array(TEXW * R * 4);
    const cath = b.tg.tCath.image.data, mono = b.tg.tMono.image.data, sec = TEXW * R * 4;
    const res = PHASES.map((name) => ({ phase: name, min: Infinity, id: -1, T: 0, grounded: { min: Infinity, id: -1, T: 0, n: 0 }, samples: 0 }));
    const netWas = U.uFloorNet.value; U.uFloorNet.value = net ? 1 : 0;
    for (let T = t0; T <= t1 + 1e-9; T += step) {
      stateAt(Math.min(T, NOMINAL - 1e-4));
      renderer.readRenderTargetPixels(b.rt, 0, 0, TEXW, R, P, undefined, 0);
      renderer.readRenderTargetPixels(b.rt, 0, 0, TEXW, R, Vb, undefined, 3);
      for (let id = 0; id < N; id++) {
        const ph = Math.round(Vb[id * 4 + 3]), r = res[ph] || res[0], y = P[id * 4 + 1] - P[id * 4 + 3] * g * 0.6;
        // legitimately grounded: the monolith's base (tiled / lock) and the cathedral's floor-level targets (debris flag 2)
        const grounded = ph === 0 || ph === 10 ? mono[id * 4 + 1] - g * 0.6 < 0.12 : ph === 4 ? cath[2 * sec + id * 4 + 3] > 1.5 || cath[id * 4 + 1] - cath[id * 4 + 3] * g * 0.6 < 0.12 : false;
        const slot = grounded ? r.grounded : r;
        if (grounded) r.grounded.n++; else r.samples++;
        if (y < slot.min) { slot.min = y; slot.id = id; slot.T = +T.toFixed(3); }
      }
    }
    U.uFloorNet.value = netWas;
    const free = res.filter((r) => ['burst', 'vortex', 'murmuration', 'flock', 'spray', 'spiral', 'column'].includes(r.phase) && r.samples);
    const whale = res[6];
    const rows = res.map((r) => ({ phase: r.phase, min: r.samples ? +r.min.toFixed(3) : null, id: r.id, T: r.T, groundedMin: r.grounded.n ? +r.grounded.min.toFixed(3) : null, groundedId: r.grounded.id, groundedT: r.grounded.T }));
    return { pass: free.every((r) => r.min >= 0.05) && (!whale.samples || whale.min >= 0.4), freeMin: Math.min(...free.map((r) => r.min)), whaleMin: whale.samples ? whale.min : null, net, rows };
  });
  // JS mirror check of the whale's extremities (fin tips, flukes, belly, jaw): the lowest point each reaches
  const whaleClearance = (t0 = 19.6, t1 = 27.5, step = 0.02) => {
    const p = V3();
    return Whale.extremities().map((tip) => {
      let min = Infinity, at = 0;
      for (let T = t0; T <= t1; T += step) { Whale.world(tip.p, tip.s, tip.part, tip.span, T, p); if (p.y < min) { min = p.y; at = T; } }
      return { part: tip.name, min: +min.toFixed(3), T: +at.toFixed(2) };
    });
  };
  const loseContext = (ms = 1500) => { const ext = renderer.getContext().getExtension('WEBGL_lose_context'); if (!ext) return 'no WEBGL_lose_context'; ext.loseContext(); setTimeout(() => ext.restoreContext(), ms); return 'lost; restoring in ' + ms + ' ms'; };
  if (DEBUG) window.__obs = { app, audio, CONFIG, loadMs, loadSteps, renderer, director, PostFX, U, tick, Whale, Story, ShardSystem, Environment, Lighting, Embers, meshes,
    shot: shotFn, sheet, grid, crop, review, clear: clearOv, edit: Edit, orbit, floorCheck, loopCheck: CONFIG.features.loopCheck ? loopCheck : undefined, swapCheck, whaleClearance, loseContext,
    net: (on) => { U.uFloorNet.value = on ? 1 : 0; return on; }, record: (o) => (app.record ? app.record(o) : 'not in ?capture') };
  setTimeout(() => { Loader.done(); last = performance.now(); }, 100);
}

main().catch((e) => { console.error(e); Loader.fail('Something went wrong while cooling the glass: ' + e.message); });
</script>
