<!DOCTYPE html>
<!--
  OBSIDIAN — an 18-second self-playing looping cinematic.
  A black monolith on a mirror salt flat shatters into tens of thousands of shards that become a
  glass cathedral, then a colossal whale, then the monolith again.

  The story is authored on a 36-second clock; what plays is an 18-second EDIT of it (CONFIG.edit):
  speed ramps through each take and three hard cuts that drop the slow passages. The Orbit button
  (or O) hands the camera to the viewer: drag to orbit, scroll to zoom, right-drag to pan.

  HOW TO RUN: this file uses ES modules and an import map, which browsers refuse to load from
  file://. Serve the folder with any local static server, e.g.

      npx serve .          (then open the printed http://localhost URL)
      python3 -m http.server

  Everything (fracture, cathedral, whale, sky, water, shaders, sound) is procedural and generated at
  startup from a seeded RNG. The only external dependency is three.js, pinned below and loaded
  from jsDelivr.

  URL switches:  ?tier=low|medium|high   ?reducedmotion   ?capture[&size=1920x1080|1080x1080|1080x1920
  &start=<s>&format=video|png]   ?debug (window.__obs: contact sheets, floorCheck, swapCheck, loopCheck, edit…)
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Obsidian</title>
<style>
  :root {
    --bg: #07060a;
    --glass: rgba(16, 13, 20, 0.58);
    --glass-2: rgba(28, 22, 30, 0.72);
    --line: rgba(255, 232, 210, 0.13);
    --ink: #f4ece3;
    --ink-soft: rgba(244, 236, 227, 0.58);
    --ink-faint: rgba(244, 236, 227, 0.22);
    --ember: #ff9b55;
    --ember-2: #ffcf8a;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  canvas#c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; outline: none; cursor: grab; }
  canvas#c:active { cursor: grabbing; }
  body.hide-cursor canvas#c { cursor: none; }

  /* ---------- loader: an obsidian shard that cracks, bursts and re-fuses, in a loop ---------- */
  #loader {
    position: fixed; inset: 0; z-index: 30; display: grid; place-items: center;
    background: radial-gradient(ellipse 90% 60% at 50% 72%, #3a1a14 0%, #160c10 45%, #07060a 100%);
    transition: opacity 0.9s ease, visibility 0.9s;
  }
  #loader.done { opacity: 0; visibility: hidden; }
  .loader-inner { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .shard-stage { width: 120px; height: 170px; filter: drop-shadow(0 10px 22px rgba(255, 120, 60, 0.18)); }
  .shard-stage .pc { fill: url(#obsGrad); stroke: rgba(255, 200, 160, 0.18); stroke-width: 0.6; transform-box: view-box; transform-origin: 60px 85px;
    animation: pcBurst 3.2s cubic-bezier(.2, .7, .2, 1) infinite; }
  .shard-stage .crk { fill: none; stroke: #ffb46a; stroke-width: 1.1; stroke-linecap: round; stroke-dasharray: 90; stroke-dashoffset: 90;
    filter: drop-shadow(0 0 3px #ff8a3a); animation: crk 3.2s ease-in infinite; }
  @keyframes crk { 0%, 8% { stroke-dashoffset: 90; opacity: 0; } 12% { opacity: 1; } 38% { stroke-dashoffset: 0; opacity: 1; } 46%, 84% { opacity: 0; stroke-dashoffset: 0; }
    92% { opacity: 0.9; } 100% { opacity: 0; stroke-dashoffset: 0; } }
  @keyframes pcBurst {
    0%, 40% { transform: translate(0, 0) rotate(0deg); }
    52% { transform: translate(calc(var(--dx) * 1px), calc(var(--dy) * 1px)) rotate(calc(var(--r) * 1deg)); }
    72% { transform: translate(calc(var(--dx) * 1.12px), calc(var(--dy) * 1.12px - 3px)) rotate(calc(var(--r) * 1.3deg)); }
    92%, 100% { transform: translate(0, 0) rotate(0deg); }
  }
  .loader-title { font: 300 22px/1 var(--sans); letter-spacing: 0.52em; text-indent: 0.52em; color: var(--ink); }
  .loader-text { font: 400 12px/1.3 var(--sans); letter-spacing: 0.08em; color: var(--ink-soft); min-height: 1.3em; }
  .loader-bar { width: 180px; height: 1px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
  .loader-bar > i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--ember), var(--ember-2)); transition: width 0.2s ease; }

  /* ---------- HUD: one slim dark-glass strip ---------- */
  #hud {
    position: fixed; left: 50%; bottom: max(12px, env(safe-area-inset-bottom)); transform: translate(-50%, 0);
    width: min(720px, calc(100vw - 32px)); z-index: 10;
    display: flex; align-items: center; gap: 14px;
    padding: 5px 8px 5px 14px; border-radius: 10px;
    background: linear-gradient(180deg, var(--glass-2), var(--glass));
    border: 1px solid var(--line);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3);
    transition: opacity 0.6s ease, transform 0.6s ease;
    user-select: none; -webkit-user-select: none;
  }
  #hud.hidden { opacity: 0; transform: translate(-50%, 10px); pointer-events: none; }
  #hud.force-hidden { display: none; }
  .stage { display: flex; flex-direction: column; min-width: 0; width: 132px; flex: none; line-height: 1.15; }
  #stage-name { font: 600 10.5px/1.2 var(--sans); letter-spacing: 0.28em; text-transform: uppercase; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #readout { font: 500 9px/1.3 var(--mono); letter-spacing: 0.08em; color: var(--ink-soft); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .btns { display: flex; gap: 4px; flex: none; }
  .btn {
    appearance: none; border: 1px solid rgba(255, 236, 214, 0.14); background: rgba(255, 255, 255, 0.04);
    color: var(--ink); height: 26px; min-width: 30px; padding: 0 8px; border-radius: 6px;
    font: 600 10px/1 var(--sans); letter-spacing: 0.12em; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .btn:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 236, 214, 0.28); }
  .btn:focus-visible, .timeline:focus-visible, #sound-chip:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
  .btn svg { width: 12px; height: 12px; fill: currentColor; }
  .btn[aria-pressed="true"] { border-color: rgba(255, 155, 85, 0.6); color: var(--ember-2); }

  .timeline { position: relative; flex: 1; min-width: 80px; height: 30px; cursor: pointer; touch-action: none; }
  .track { position: absolute; left: 0; right: 0; top: 9px; height: 2px; border-radius: 1px; background: rgba(255, 255, 255, 0.12); }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; border-radius: 1px; background: linear-gradient(90deg, rgba(255, 155, 85, 0.5), var(--ember-2)); }
  .thumb { position: absolute; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%;
    background: var(--ink); box-shadow: 0 0 0 3px rgba(255, 155, 85, 0.25), 0 0 10px rgba(255, 170, 100, 0.6); left: 0%; }
  .marker { position: absolute; top: -3px; width: 1px; height: 8px; background: rgba(255, 236, 214, 0.55); }
  .marker.minor { top: -1px; height: 4px; background: rgba(255, 236, 214, 0.25); }
  .labels { position: absolute; left: 0; right: 0; top: 16px; height: 12px; font: 600 7.5px/12px var(--sans); letter-spacing: 0.2em; color: var(--ink-faint); }
  .labels span { position: absolute; white-space: nowrap; transition: color 0.3s ease; }
  .labels span.active { color: var(--ember-2); }

  #sound-chip {
    position: fixed; top: max(16px, env(safe-area-inset-top)); right: 16px; z-index: 11;
    appearance: none; border: 1px solid var(--line); color: var(--ink);
    background: linear-gradient(180deg, var(--glass-2), var(--glass));
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    font: 600 10.5px/1 var(--sans); letter-spacing: 0.2em; text-transform: uppercase; padding: 9px 14px; border-radius: 20px; cursor: pointer;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
    transition: opacity 0.8s ease; display: inline-flex; gap: 8px; align-items: center;
  }
  #sound-chip.gone { opacity: 0; pointer-events: none; }
  /* free-camera hint: sits just above the HUD while the viewer holds the camera */
  #orbit-hint {
    position: fixed; left: 50%; bottom: calc(max(12px, env(safe-area-inset-bottom)) + 52px); transform: translate(-50%, 6px); z-index: 10;
    max-width: calc(100vw - 32px); padding: 7px 14px; border-radius: 16px; border: 1px solid var(--line);
    background: linear-gradient(180deg, var(--glass-2), var(--glass)); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    font: 500 11px/1.35 var(--sans); letter-spacing: 0.06em; color: var(--ink-soft); text-align: center;
    opacity: 0; pointer-events: none; transition: opacity 0.5s ease, transform 0.5s ease;
  }
  #orbit-hint b { color: var(--ember-2); font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; margin-right: 6px; }
  #orbit-hint.on { opacity: 1; transform: translate(-50%, 0); }
  body.capture #orbit-hint { display: none; }
  #debug {
    position: fixed; top: 10px; left: 10px; z-index: 12; display: none; white-space: pre;
    font: 11px/1.45 var(--mono); color: #f5ecd8;
    background: rgba(8, 6, 10, 0.72); padding: 8px 10px; border-radius: 6px; pointer-events: none; border: 1px solid var(--line);
  }
  #debug.on { display: block; }
  #fatal { position: fixed; inset: 0; display: none; place-items: center; z-index: 40; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); text-align: center; padding: 24px; }
  #ctxlost { position: fixed; inset: 0; z-index: 35; display: none; place-items: center; background: rgba(7, 6, 10, 0.72); color: var(--ink-soft);
    font: 500 11px/1.5 var(--sans); letter-spacing: 0.22em; text-transform: uppercase; text-align: center; padding: 24px; }
  #ctxlost.on { display: grid; }

  /* ---------- capture mode (?capture): no HUD or chip, the canvas at a fixed render size, a small recorder panel ---------- */
  body.capture #hud, body.capture #sound-chip { display: none; }
  body.capture canvas#c { inset: auto; left: 50%; top: 50%; transform: translate(-50%, -50%); cursor: default; }
  #capture {
    position: fixed; top: 12px; left: 12px; z-index: 13; display: none; align-items: center; flex-wrap: wrap; gap: 8px;
    max-width: calc(100vw - 24px); padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: linear-gradient(180deg, var(--glass-2), var(--glass)); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    font: 500 10.5px/1.2 var(--sans); letter-spacing: 0.06em; color: var(--ink-soft);
  }
  body.capture #capture { display: flex; }
  #capture label { display: inline-flex; align-items: center; gap: 5px; }
  #capture select, #capture input { appearance: none; background: rgba(255, 255, 255, 0.06); color: var(--ink); border: 1px solid var(--line); border-radius: 5px; font: 11px var(--mono); padding: 3px 6px; }
  #capture input { width: 62px; }
  #cap-status { font: 10.5px var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }

  @media (max-width: 560px) {
    #hud { gap: 6px; padding: 4px 5px 4px 9px; bottom: max(8px, env(safe-area-inset-bottom)); }
    .timeline { min-width: 64px; }
    #orbit-hint { bottom: calc(max(8px, env(safe-area-inset-bottom)) + 46px); }
    .stage { width: 88px; }
    #stage-name { font-size: 9px; letter-spacing: 0.16em; }
    #readout { display: none; }
    .btn { height: 24px; min-width: 25px; padding: 0 5px; font-size: 9px; letter-spacing: 0.04em; }
    .labels { font-size: 6.5px; letter-spacing: 0.06em; }
    .labels span:not(.active) { opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .shard-stage .pc, .shard-stage .crk { animation-duration: 6s; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="c" tabindex="-1" aria-label="Obsidian cinematic"></canvas>

<div id="loader" role="status" aria-live="polite">
  <div class="loader-inner">
    <svg class="shard-stage" viewBox="0 0 120 170" aria-hidden="true">
      <defs>
        <linearGradient id="obsGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#3b3340"/><stop offset="0.45" stop-color="#0d0b10"/><stop offset="0.8" stop-color="#1b1418"/><stop offset="1" stop-color="#5a2e20"/>
        </linearGradient>
      </defs>
      <polygon class="pc" style="--dx:-7;--dy:-12;--r:-9" points="58,6 71,24 62,44 47,40 44,22"/>
      <polygon class="pc" style="--dx:9;--dy:-7;--r:11" points="71,24 84,52 70,66 62,44"/>
      <polygon class="pc" style="--dx:-11;--dy:-2;--r:-6" points="44,22 47,40 41,70 30,58 34,36"/>
      <polygon class="pc" style="--dx:2;--dy:1;--r:7" points="47,40 62,44 70,66 58,88 41,70"/>
      <polygon class="pc" style="--dx:12;--dy:6;--r:14" points="84,52 88,86 76,104 58,88 70,66"/>
      <polygon class="pc" style="--dx:-12;--dy:8;--r:-12" points="30,58 41,70 58,88 50,112 32,100 27,78"/>
      <polygon class="pc" style="--dx:8;--dy:13;--r:8" points="58,88 76,104 72,138 60,160 52,134 50,112"/>
      <polygon class="pc" style="--dx:-6;--dy:15;--r:-15" points="32,100 50,112 52,134 60,160 40,138"/>
      <path class="crk" d="M62 44 L47 40 M62 44 L70 66 L58 88 L41 70 L47 40 M58 88 L50 112 L52 134 M70 66 L84 52 M58 88 L76 104 M41 70 L30 58"/>
    </svg>
    <div class="loader-title">OBSIDIAN</div>
    <div class="loader-bar"><i id="load-bar"></i></div>
    <div class="loader-text" id="load-text">Cooling the glass…</div>
  </div>
</div>

<div id="hud" class="hud" role="region" aria-label="Cinematic controls">
  <div class="stage" aria-live="polite">
    <span id="stage-name">The Monolith</span><span id="readout">0.0 S</span>
  </div>
  <div class="timeline" id="timeline" role="slider" tabindex="0" aria-label="Cycle position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0 seconds, The Monolith">

  <div class="btns">
    <button class="btn" id="btn-play" type="button" aria-label="Pause">

    </button>

<div id="orbit-hint" role="status" aria-live="polite"></div>

<button id="sound-chip" type="button" aria-label="Tap for sound">
  <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" fill="currentColor"><path d="M2 6h3l4-3v10L5 10H2z"/><path d="M11 5.2c1 .7 1.5 1.7 1.5 2.8s-.5 2.1-1.5 2.8l-.7-.8c.7-.5 1.1-1.2 1.1-2s-.4-1.5-1.1-2z"/></svg>
  Tap for sound

<div id="capture" role="region" aria-label="Capture one cycle">
  <label>Size <select id="cap-size"><option value="1920x1080">1920×1080</option><option value="1080x1080">1080×1080</option><option value="1080x1920">1080×1920</option></select></label>
  <label>Start <input id="cap-start" type="number" min="0" max="17.9" step="0.1" value="0"> s</label>
  <label>Format <select id="cap-fmt"><option value="video">Video</option><option value="png">PNG sequence</option></select></label>
  <button class="btn" id="cap-go" type="button">REC</button>
  <span id="cap-status"></span>
</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Pass, FullScreenQuad } from 'three/addons/postprocessing/Pass.js';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';
import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =====================================================================================
   CONFIG
   The beat sheet is authored against a NOMINAL 36 s story clock and stored as fractions of
   it. The story runs in nominal seconds T, and the beat fractions are injected into every
   shader as #defines (B_SHATTER 6.0 …), so moving a beat here moves it everywhere.

   THE EDIT. What plays is not the 36 s story but an edit of it (CONFIG.edit, ~18 s): a list of
   takes, each a span of story time squeezed into a real duration. Consecutive takes that join
   in story time are one continuous speed ramp; a gap between takes is a hard cut. The master
   clock is the real cycle position t ∈ [0, 1); Edit.story(t) maps it to T. Every frame is still
   a pure function of T, so the shards, camera, lava and water need no knowledge of the edit.

   World frame: the salt flat is the plane y = 0. The monolith stands at the origin with its
   broad face toward +z. The sun sits low toward −z (elevation 16°), so the opening shot looks
   into it. The cathedral's nave runs along z with its west façade (rose window, twin spires)
   facing the sun; the whale glides along +x on the far side of the site.
   ===================================================================================== */
const NOMINAL = 36;
const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches || /[?&]reducedmotion\b/.test(location.search);   // ?reducedmotion to preview
const DEBUG = /[?&]debug\b/.test(location.search);        // ?debug exposes window.__obs (review / verification hooks)
const CAPTURE_REQ = /[?&]capture\b/.test(location.search); // ?capture: fixed 60 fps step, High tier, one-cycle recorder
const frac = (s) => s / NOMINAL;

const CONFIG = {
  cycleDuration: REDUCED_MOTION ? 20 : 18,            // real seconds per loop; the edit's take lengths are rescaled to it
  // [story from, story to, real seconds]. Speed = story span ÷ real span. A take that starts where the previous one
  // ended (36 ≡ 0) is a ramp; anything else is a hard cut (✂). The last take must end at 36 and the first start at 0,
  // so the loop seam stays a continuous ramp.
  edit: [
    [0.0, 3.5, 1.25],       // approach: a fast push-in on the monolith
    [3.5, 6.0, 1.45],       // the cracks spread; the pulse
    [6.0, 7.6, 1.0],        // shatter, bullet time
    [7.6, 9.1, 0.8],        // the vortex funnel                        ✂ 9.1–11.5: the dark fly-through inside it
    [11.5, 12.45, 0.6],     // the murmuration, wide
    [12.45, 15.2, 2.2],     // the cathedral snaps together, spires last
    [15.2, 18.7, 2.4],      // the rose window lights; through the nave; the glass peels   ✂ 18.7–20.0: the dark flock
    [20.0, 21.6, 1.0],      // the whale condenses head-first
    [21.6, 25.3, 1.9],      // the whale glides and banks
    [25.3, 28.6, 2.5],      // breach, burst, shard rain                ✂ 28.6–31.0: the skimming spiral
    [31.0, 33.6, 1.6],      // the column compacts into the monolith
    [33.6, 36.0, 1.3],      // fused; the seams cool; back to the opening
  ],
  seed: 0x0b51d1a,
  hudHide: 2.5,
  beats: {
    // Beat 1 — THE MONOLITH (0–7 s)
    open: frac(0.0), gust: frac(2.0), cracks: frac(3.5), pulse: frac(5.0), shatter: frac(6.0), bullet: frac(6.3),
    // Beat 2 — THE CATHEDRAL (7–17 s)
    cathedral: frac(7.0), resume: frac(7.5), flythrough: frac(9.0), murmur: frac(11.0), build: frac(12.5), spires: frac(14.3), light: frac(15.0),
    // Beat 3 — THE WHALE (17–29 s)
    whale: frac(17.0), peel: frac(17.5), emerge: frac(20.0), glide: frac(21.0), roll: frac(24.0), breach: frac(26.0), burst: frac(27.5),
    // Beat 4 — THE RETURN (29–36 s)
    ret: frac(29.0), column: frac(31.0), lock: frac(33.0), fuse: frac(33.6), settle: frac(34.0),
  },
  stages: [
    { key: 'MONOLITH', label: 'The Monolith', at: 'open' },
    { key: 'CATHEDRAL', label: 'The Cathedral', at: 'cathedral' },
    { key: 'WHALE', label: 'The Whale', at: 'whale' },
    { key: 'RETURN', label: 'The Return', at: 'ret' },

// The cloud field drifts around a CIRCLE in noise space once per cycle, so t = 36 s ≡ t = 0 s.

float wBoost(float T) { return 1.0 + W_BOOST * win(T, 25.5, 26.1, 27.3, 27.9); }

// lowest point sits W_TAIL_L behind the centre and A' = (fluke drop + tail wave)·cos(roll) + fluke half-span·|sin(roll)|
// below the spine; keeping it W_FLOOR_M above the flat is  y − L·sin θ − A'·cos θ ≥ m, solved exactly:
//     θ ≤ asin((y − m) / √(L² + A'²)) − atan(A', L)

// world pose of one whale shard at time T (trail shards hang behind the flukes, lagging in time)
void whaleState(vec3 wl, vec4 wq, vec4 wx, vec4 rB, vec3 tAx, float T, float net, out vec3 P, out vec4 Q) {
  if (int(wx.y + 0.5) == 5) {
    float lag = 0.12 + 1.35 * wx.z, Tl = T - lag;
    vec3 lp = vec3(-13.4, spineY(0.97) + waveAmp(0.97, Tl) * sin(4.85 - 2.4 * Tl), wl.z);
    vec3 F0 = whalePath(Tl) + whaleFrame(Tl) * lp;                 // where the flukes were lag seconds ago
    vec3 off = (rB.xyz - 0.5) * (0.6 + 2.4 * lag) + vec3(0.0, -0.9 * lag * lag, 0.0);
    // the trail scatters and sags below those flukes only as far as their clearance allows (smoothly, no clamp)
    float room = max(F0.y - TRAIL_FLOOR, 0.02);
    if (off.y < 0.0) off.y = -room * tanh(min(-off.y / room, 9.0));
    P = F0 + off;
    P.y = max(P.y, 0.35);                                           // last resort — practically never engages now
    Q = qmul(qaxis(tAx, T * 3.0), wq);
  } else {
    vec3 lp = wl; vec4 lq = wq;
    whaleSwim(lp, lq, wx, T);
    mat3 F = whaleFrame(T);
    P = whalePath(T) + F * lp;
    Q = qmul(qFromMat(F), lq);
  }
#if WHALE_FLOOR_NET
  // safety net: a smooth max that only lifts points within ~0.6 m of the flat, so it reads as the extremity flexing.
  // The flight itself clears the flat with the net OFF (__obs.floorCheck verifies that).
  if (net > 0.5) P.y = smaxK(P.y, 0.3, 0.6);
#endif
}
`;

// ---------------------------------------------------------------- the state pass
/* One fragment per shard, rendered into a 4-target float MRT (every frame while the shards are drawn;
   once while the solid monolith stands in for them). It evaluates the shard's whole journey
   ANALYTICALLY in T (no simulation, so scrubbing works both ways):

     A → cloud  : bez(A, A + n_A·kick, C − v_C·dur/3, C; ease(s))     leave along A's normal,
                                                                      arrive with the cloud's flow
     cloud → B  : bez(C, C + v_C·dur/3, B + n_B·reach, B; easeLock(s)) leave with the flow,
                                                                      approach along B's normal
     cloud → cloud: bez(C₀, C₀ + v₀·k, C₁ − v₁·k, C₁; eio(s))
     per shard  : s = clamp((T − start − delay) / duration, 0, 1), delay by height / spine / rank
   The Bézier endpoints are LIVE (evaluated at the current T), so a shard leaves or joins a moving
   cloud with exactly the cloud's velocity — no hitch at either end.
   Rotation: q = tumble(axis_i, spins·π·sin(πs)) · slerp(q_A, q_B, eio(s)) — the tumble is zero at
   both ends, so shards spin in flight and settle cleanly on arrival.
   Free flight is kept off the mirror (softFloor, the burst's skid) and out of a bubble around the
   camera; the whale clears the flat by its clearance-aware pitch (SHADERS.whale).
   Velocity: on velocity tiers the same journey is evaluated again at T − 1/60 (still analytic).
   Outputs: oPos = (world centre, scale), oQuat, oMat = (glass, whale, lava share, spin rate),
   oVel = (world velocity, phase id). */
SHADERS.stateFrag = /* glsl */`
precision highp float; precision highp int;
uniform float uT;
uniform float uBulletTime;       // effective (remapped) seconds since the shatter — bullet time lives here
uniform float uBulletTimePrev;   // … at T − VEL_DT
uniform vec3 uCamPos, uCamPosPrev;   // the shot's camera (before handheld drift) at T and at T − VEL_DT
uniform float uFloorNet;         // the whale's floor net (debug toggle; compiled in by WHALE_FLOOR_NET)
uniform float uShardG;           // the fracture grid size: a shard's half-extent ≈ scale · g · 0.6
uniform sampler2D tMono, tCath, tWhale, tStatic;
uniform int uRows, uCount;
layout(location = 0) out vec4 oPos;
layout(location = 1) out vec4 oQuat;
layout(location = 2) out vec4 oMat;
layout(location = 3) out vec4 oVel;   // world velocity (m per story second) · phase id
vec4 fetch(sampler2D t, int id, int sec) { return texelFetch(t, ivec2(id % TEXW, id / TEXW + sec * uRows), 0); }
// phase ids (oVel.w) — the flight a shard is in; __obs.floorCheck reports by these
#define PH_TILED 0.0
#define PH_BURST 1.0
#define PH_VORTEX 2.0
#define PH_MURM 3.0
#define PH_CATH 4.0
#define PH_FLOCK 5.0
#define PH_WHALE 6.0
#define PH_SPRAY 7.0
#define PH_SPIRAL 8.0
#define PH_COLUMN 9.0
#define PH_LOCK 10.0
// keeps a free-flying shard's centre off the mirror: a smooth max against (half-extent r + 8 cm) — the identity
// more than 20 cm above that. Free flight only, never locked targets.
float softFloor(float y, float r) { return smaxK(y, r + 0.08, 0.2); }
// pushes a shard smoothly out of a CAM_BUBBLE sphere around the camera, so fly-throughs never slice shards
vec3 camBubble(vec3 p, vec3 C) {
  vec3 d = p - C; float l = length(d);
  if (l > CAM_BUBBLE + 0.8) return p;
  return C + (l > 1e-4 ? d / l : vec3(0.0, 1.0, 0.0)) * smaxK(l, CAM_BUBBLE, 0.8);
}

// cloud 1 — a towering vortex over the site (cylindrical coords, height-dependent rotation); the base ring rides
// at ≥ 0.7 m (its bob fades out at the bottom) instead of dipping under the flat
vec3 vortexPos(float h, float th0, vec4 rA, vec4 rB, float T, float r, out vec3 vel) {
  float hv = sat(h + (rA.z - 0.5) * 0.14), core = step(rB.w, 0.06), bob = smoothstep(0.0, 0.06, hv);
  float y = 0.7 + 24.5 * hv + 0.9 * bob * sin(T * 1.3 + rA.y * TAU);
  float rr = mix((2.2 + 8.5 * pow(max(hv, 0.0), 1.35)) * (0.72 + 0.56 * rB.z), 0.25 + 1.2 * rB.z, core);
  float w = (1.7 - 1.0 * hv) * (1.0 + 0.6 * core);
  float th = th0 + rA.y * 0.6 + w * (T - 7.5);
  vel = vec3(-sin(th) * rr * w, 1.17 * bob * cos(T * 1.3 + rA.y * TAU), cos(th) * rr * w);
  return vec3(cos(th) * rr, softFloor(y, r), sin(th) * rr);
}
// cloud 2 — a starling murmuration: a flattened flock over the cathedral site (derived from each
// shard's cathedral target, so the landing is coherent) rippled by travelling density waves
vec3 murmPos(vec3 C, vec4 rA, float T, out vec3 vel) {
  vec3 b = vec3(C.x * 0.95, 13.0 + C.y * 0.42, C.z * 0.78 - 1.0) + (rA.zxy - 0.5) * vec3(4.0, 3.0, 4.0);
  float p1 = dot(b.xz, vec2(0.17, 0.06)) - 2.3 * T, p2 = dot(b.xz, vec2(-0.08, 0.14)) - 1.8 * T + 1.3, p3 = b.y * 0.3 + b.x * 0.09 - 2.7 * T;
  vec3 d = vec3(2.2 * sin(p2) + 1.2 * sin(p3), 3.0 * sin(p1) + 1.6 * sin(p2), 2.6 * sin(p1 + 0.7));
  vel = vec3(-3.96 * cos(p2) - 3.24 * cos(p3), -6.9 * cos(p1) - 2.88 * cos(p2), -5.98 * cos(p1 + 0.7));
  vec3 p = b + d; float a = 0.3 * sin(T * 0.5), c = cos(a), s = sin(a);
  p.xz = mat2(c, s, -s, c) * p.xz;
  return p;
}
// cloud 3 — the flock the cathedral dissolves into: a vast, swirling, inflated ghost of the whale
vec3 flockPos(vec3 wl, vec4 wx, vec4 rA, vec4 rB, float T, out vec3 vel) {
  float Tf = max(T, 20.0), s = wx.x;
  vec3 sp = vec3(14.0 - 28.0 * s, spineY(s), 0.0), o = wl - sp;
  float a = 0.4 * (1.3 * T + s * 5.0 + rA.x * TAU), c = cos(a), sn = sin(a);
  o.yz = mat2(c, sn, -sn, c) * o.yz * (2.0 + 1.8 * rB.y);
  vec3 lp = vec3(sp.x * 1.25, sp.y + 2.0 * sin(T * 1.7 + s * 6.0), 0.0) + o + (rA.yzw - 0.5) * vec3(6.0, 4.0, 6.0);
  vec3 P = whalePath(Tf) + whaleFrame(Tf) * lp;
  P.y = max(P.y, 0.8 + rB.x);
  vel = T > 20.0 ? (whalePath(T + 0.05) - whalePath(T - 0.05)) * 10.0 : vec3(0.0, 0.0, 0.0);
  return P;
}
// cloud 4 — a vast 3-armed skimming spiral just above the water (differential rotation winds it); its lowest
// shards ride ≥ 0.24 m, above 0.15 m + a shard's half-extent
vec3 spiralPos(float rank, vec4 rA, vec4 rB, float T, float r, out vec3 vel) {
  float R = 4.5 + 38.0 * pow(max(rank, 0.0), 0.85), arm = floor(rB.w * 3.0);
  float th0 = arm * 2.0944 + 1.7 * log(R) + (rB.z - 0.5) * 0.45, w = 2.6 / sqrt(R), th = th0 + w * (T - 29.0);
  vel = vec3(-sin(th), 0.0, cos(th)) * R * w;
  return vec3(cos(th) * R, softFloor(0.36 + 0.45 * rA.z + 0.12 * sin(T * 3.1 + rA.w * TAU), r), sin(th) * R);
}
// cloud 5 — the tightening column around the monolith's footprint (its base ring bobs at ≥ 0.3 m; the lock then
// blends each shard into its true monolith cell)
vec3 columnPos(vec3 M, float th0, vec4 rA, vec4 rB, float T, float r, out vec3 vel) {
  float k = eio(sat((T - 30.6) / 2.4)), rc = mix(7.5, 2.4, k) * (0.85 + 0.3 * rB.y), w = 2.2 + 1.2 * k;
  float th = th0 + rA.x * 0.8 + w * (T - 30.6);
  vel = vec3(-sin(th), 0.0, cos(th)) * rc * w;
  return vec3(cos(th) * rc, softFloor(max(M.y, 0.3) + 0.35 * sin(T * 2.3 + rB.x * TAU), r), sin(th) * rc);
}

struct Shard { vec4 rA, rB, mP, mQ, mX; };
// ONE shard's whole journey, analytically in T (called twice when the velocity output is on)
void shardState(int id, Shard sd, float T, float te, vec3 cam, out vec3 pos, out vec4 q, out float scl, out vec4 mat, out float ph) {
  vec4 rA = sd.rA, rB = sd.rB, mP = sd.mP, mQ = sd.mQ, mX = sd.mX;
  vec3 M = mP.xyz, nM = qrot(mQ, vec3(0.0, 0.0, 1.0));
  float hM = mX.x, r0 = uShardG * 0.6;
  vec3 tAx = normalize(rA.xyz - 0.5 + vec3(0.0, 0.0, 1e-3)), tAx2 = normalize(rB.zxy - 0.5 + vec3(1e-3, 0.0, 0.0));
  float spins = 1.0 + floor(rB.x * 3.0), wSpin = 0.8 + 2.4 * rA.w;
  vec4 qCloud = qmul(qaxis(tAx2, wSpin * T + rB.y * TAU), mQ);     // continuous tumble inside any cloud
  pos = M; q = mQ; scl = 1.0; ph = PH_TILED;
  float glass = 0.0, whale = 0.0, glow = 0.0, spin = 0.0;       // glow: this shard's share of the lava state

  if (T < B_SHATTER) {
    // tiled in the monolith (the solid mesh is drawn instead; this keeps the state continuous)
    glow = 1.0;
  } else if (T < 12.45) {
    // ---- shatter: exponential burst along the face normal, bullet time via te ----
    vec3 radial = normalize(vec3(M.x, 0.0, M.z) + vec3(1e-4, 0.0, 0.0));
    vec3 bDir = normalize(nM * 0.8 + radial * 0.75 + (rB.yzw - 0.5) * 1.2 + vec3(0.0, 0.3, 0.0));
    float bDist = mix(2.0, 9.5, rA.w * rA.w) * (0.8 + 0.4 * rB.z), e = 1.0 - exp(-4.6 * te), d = bDist * e;
    vec3 bp = M + bDir * d;
    // shards thrown downward skid along the mirror instead of going under: past the contact point the free path
    // runs flat, with drag. The floor ramps up from the shard's own base height, so a base shard starts exactly at M.
    float YF = r0 * 1.6 + 0.08;
    float fl = min(YF, M.y + 0.4 * d), yRaw = M.y + bDir.y * d;
    if (bDir.y < 0.0) bp.xz = M.xz + bDir.xz * (d - 0.45 * max(fl - yRaw, 0.0) / max(-bDir.y, 0.05));
    bp.y = smaxK(yRaw, fl, 0.12 * smoothstep(0.0, 0.3, d) + 1e-4);   // (the identity for anything thrown clear of the floor)
    float bw = 3.0 + 7.0 * rB.x;
    vec4 bq = qmul(qaxis(tAx, te * bw), mQ);
    float bs = 1.0 + 0.6 * e;
    pos = bp; q = bq; scl = bs; spin = bw * 0.5; glow = 1.0;
    ph = M.y < YF + 0.1 && d < 0.3 ? PH_TILED : PH_BURST;         // base shards still leaving the base count as grounded
    // ---- 7.5 s: time resumes, whirl up into the vortex ----
    float s2 = sat((T - 7.4 - 0.85 * (hM * 0.65 + rA.x * 0.35)) / 1.25);
    if (s2 > 0.0) {
      vec3 vV, V = vortexPos(hM, mX.y, rA, rB, T, r0 * 2.0, vV);
      // ---- 11 s: the vortex loosens into a murmuration ----
      float s3 = sat((T - 10.55 - 0.8 * rA.y) / 1.05);
      if (s3 > 0.0) {
        vec3 vMu, Mu = murmPos(fetch(tCath, id, 0).xyz, rA, T, vMu);
        pos = bez(V, V + vV * 0.35, Mu - vMu * 0.35, Mu, eio(s3));
        q = qCloud; scl = 2.0; glow = 0.3 * (1.0 - s3); spin = wSpin; ph = PH_MURM;
      } else {
        float u = eio(s2);
        pos = bez(bp, bp + bDir * 1.2 + vec3(0.0, 2.2, 0.0), V - vV * 0.42, V, u);
        q = qmul(qaxis(tAx, spins * PI * sin(PI * s2)), qslerp(bq, qCloud, u));
        scl = mix(bs, 2.0, u); glow = 1.0 - 0.7 * u; spin = mix(bw * 0.5, wSpin, u) + spins * 2.5 * sin(PI * s2); ph = PH_VORTEX;
      }
    }
  } else if (T < 17.45) {
    // ---- 12.5 s: shards snap into the cathedral from the ground up, turning to glass ----
    vec4 cP = fetch(tCath, id, 0), cQ = fetch(tCath, id, 1), cX = fetch(tCath, id, 2);
    vec3 nC = qrot(cQ, vec3(0.0, 0.0, 1.0)), vMu, Mu = murmPos(cP.xyz, rA, T, vMu);
    float s4 = sat((T - 12.45 - 1.75 * cX.z - 0.12 * rA.y) / 0.8);
    float ek = cX.w > 1.5 ? eio(s4) : easeLock(s4);             // debris lying on the flat lands without overshoot
    pos = bez(Mu, Mu + vMu * 0.27, cP.xyz + nC * 2.4, cP.xyz, ek);
    q = qmul(qaxis(tAx, spins * PI * sin(PI * s4)), qslerp(qCloud, cQ, eio(s4)));
    scl = mix(2.0, cP.w, eio(s4)); glass = smoothstep(0.55, 1.0, s4);
    spin = wSpin * (1.0 - s4) + spins * 4.0 * sin(PI * s4); ph = PH_CATH;
  } else if (T < 27.5) {
    // ---- 17.5 s: peel off from the spires down into a flock; 20 s: the whale condenses head-first ----
    vec4 cP = fetch(tCath, id, 0), cQ = fetch(tCath, id, 1), cX = fetch(tCath, id, 2);
    vec4 wl = fetch(tWhale, id, 0), wq = fetch(tWhale, id, 1), wx = fetch(tWhale, id, 2);
    vec3 nC = qrot(cQ, vec3(0.0, 0.0, 1.0));
    float s5 = sat((T - 17.5 - 1.6 * (1.0 - cX.z) - 0.15 * rA.y) / 0.9);
    float s6 = sat((T - 19.6 - 1.8 * sat(wx.w)) / 0.75);
    if (s6 > 0.0) {
      vec3 W; vec4 WQ; whaleState(wl.xyz, wq, wx, rB, tAx, T, uFloorNet, W, WQ);
      vec3 vF, Fl = flockPos(wl.xyz, wx, rA, rB, T, vF), nW = qrot(WQ, vec3(0.0, 0.0, 1.0));
      pos = bez(Fl, Fl + vF * 0.25, W + nW * 1.3, W, easeLock(s6));
      q = qmul(qaxis(tAx, spins * PI * sin(PI * s6)), qslerp(qCloud, WQ, eio(s6)));
      scl = mix(2.2, wl.w, eio(s6)); whale = smoothstep(0.4, 1.0, s6);
      spin = wSpin * (1.0 - s6) + spins * 4.0 * sin(PI * s6) + (int(wx.y + 0.5) == 5 ? 3.0 : 0.0); ph = PH_WHALE;
    } else if (s5 > 0.0) {
      vec3 vF, Fl = flockPos(wl.xyz, wx, rA, rB, T, vF);
      float u = eio(s5);
      pos = bez(cP.xyz, cP.xyz + nC * 2.5 + vec3(0.0, 1.5, 0.0), Fl - vF * 0.3, Fl, u);
      q = qmul(qaxis(tAx, spins * PI * sin(PI * s5)), qslerp(cQ, qCloud, u));
      scl = mix(cP.w, 2.2, u); glass = 1.0 - smoothstep(0.0, 0.6, s5);
      spin = wSpin * u + spins * 3.0 * sin(PI * s5); ph = PH_FLOCK;
    } else { pos = cP.xyz; q = cQ; scl = cP.w; glass = 1.0; ph = PH_CATH; }
  } else if (T < 30.6) {
    // ---- 27.5 s: the breach bursts into spray that rains down and pulls out into the spiral ----
    vec4 wl = fetch(tWhale, id, 0), wq = fetch(tWhale, id, 1), wx = fetch(tWhale, id, 2);
    vec3 Wb; vec4 WQb; whaleState(wl.xyz, wq, wx, rB, tAx, 27.5, uFloorNet, Wb, WQb);
    vec3 nW = qrot(WQb, vec3(0.0, 0.0, 1.0)), out1 = normalize(Wb - whalePath(27.5) + vec3(1e-4, 0.0, 0.0));
    float s7 = sat((T - 27.5 - 0.12 * rA.x) / 1.95);
    vec3 vS, Sp = spiralPos(hM, rA, rB, T, r0 * 1.8, vS);
    vec3 kick = (nW * 0.6 + out1 * 0.7 + vec3(0.0, 0.45, 0.0) + (rB.xyz - 0.5) * 0.5) * (7.0 + 8.0 * rA.z);
    float u = 1.0 - pow(max(1.0 - s7, 0.0), 1.7);
    pos = bez(Wb, Wb + kick, Sp - normalize(vS) * 9.0 + vec3(0.0, 0.6, 0.0), Sp, u);
    q = qmul(qaxis(tAx, spins * PI * sin(PI * s7)), qslerp(WQb, qCloud, eio(s7)));
    scl = mix(wl.w, 1.8, eio(s7)); whale = 1.0 - smoothstep(0.05, 0.5, s7);
    glow = 1.0; spin = wSpin * s7 + spins * 4.0 * sin(PI * s7);
    ph = s7 < 1.0 ? PH_SPRAY : PH_SPIRAL;
  } else {
    // ---- 31 s: the spiral rises into a tightening column that compacts bottom-up into the monolith ----
    vec3 vS, Sp = spiralPos(hM, rA, rB, T, r0 * 1.8, vS);
    float sA = sat((T - 30.6 - 0.9 * hM - 0.1 * rA.x) / 1.1);
    vec3 vC, Col = columnPos(M, mX.y, rA, rB, T, r0 * 1.5, vC);
    vec3 cur = Sp, vcur = vS;
    ph = PH_SPIRAL;
    if (sA > 0.0) { float u = eio(sA); cur = bez(Sp, Sp + vS * 0.37, Col - vC * 0.37, Col, u); vcur = mix(vS, vC, u); ph = PH_COLUMN; }
    float sB = sat((T - 30.95 - 1.5 * hM - 0.05 * rA.y) / 0.5);
    if (sB > 0.0) {
      pos = bez(cur, cur + vcur * 0.17, M + nM * 0.7, M, easeLock(sB));
      q = qmul(qaxis(tAx, spins * PI * sin(PI * sB)), qslerp(qCloud, mQ, eio(sB)));
      scl = mix(1.5, 1.0, eio(sB)); glow = smoothstep(0.7, 1.0, sB);
      spin = wSpin * (1.0 - sB) + spins * 5.0 * sin(PI * sB); ph = PH_LOCK;
    } else { pos = cur; q = qCloud; scl = mix(1.8, 1.5, sA); spin = wSpin; }
  }
  // free flight: out of the camera's bubble, and (except the burst, which skids on its own floor) off the mirror.
  // Locked targets are never touched; the whale clears the flat by design (plus its own net).
  bool held = ph == PH_TILED || ph == PH_CATH || ph == PH_LOCK || ph == PH_WHALE;
  if (!held) {
    pos = camBubble(pos, cam);
    if (ph != PH_BURST) pos.y = softFloor(pos.y, r0 * scl);
  }
  mat = vec4(glass, whale, glow, spin);
}

void main() {
  ivec2 px = ivec2(gl_FragCoord.xy);
  int id = px.x + px.y * TEXW;
  if (id >= uCount) { oPos = vec4(0.0); oQuat = vec4(0.0, 0.0, 0.0, 1.0); oMat = vec4(0.0); oVel = vec4(0.0); return; }
  Shard sd;
  sd.rA = fetch(tStatic, id, 0); sd.rB = fetch(tStatic, id, 1);
  sd.mP = fetch(tMono, id, 0); sd.mQ = fetch(tMono, id, 1); sd.mX = fetch(tMono, id, 2);
  float T = uT * NOMINAL, ph, scl;
  vec3 pos; vec4 q, m;
  shardState(id, sd, T, uBulletTime, uCamPos, pos, q, scl, m, ph);
  vec3 vel = vec3(0.0);
#ifdef STATE_VEL
  // the same journey 1/60 s earlier → velocity (no simulation state). Compiled in only on tiers that use it.
  vec3 p0; vec4 q0, m0; float s0, ph0;
  shardState(id, sd, T - VEL_DT, uBulletTimePrev, uCamPosPrev, p0, q0, s0, m0, ph0);
  vel = (pos - p0) * (1.0 / VEL_DT);
#endif
  oPos = vec4(pos, scl);
  oQuat = normalize(q);
  oMat = m;
  oVel = vec4(vel, ph);
}
`;

// ---------------------------------------------------------------- the shard cloud (ONE draw call)
/* VERTEX PULLING: aShard.x is the shard ID. The vertex fetches that shard's CURRENT transform
   (centre, scale, quaternion) and material state from the state-pass MRT by ID and places its
   shard-local position: world = centre + rotate(q, local · scale). All 20k shards are one mesh,
   one draw call; the shadow pass (customDepthMaterial) and the reflection pass use the same
   fetch, so shadows, depth and reflections follow the flying shards exactly. */
// the velocity stretch shared by the shard's colour and depth vertex shaders: in the fast flights (vortex, spray,
// spiral) a shard is elongated along its motion by a shutter's worth of travel — motion blur, analytically
SHADERS.pull = /* glsl */`
uniform float uRate;         // the edit's speed (story seconds per real second): the shutter is open for real time
vec3 velStretch(vec3 o, vec4 Vl, float s, float g) {
  float sp = length(Vl.xyz), ph = Vl.w;
  if (sp < 2.0 || !(abs(ph - 2.0) < 0.5 || abs(ph - 7.0) < 0.5 || abs(ph - 8.0) < 0.5)) return o;
  vec3 vd = Vl.xyz / sp;
  return o + vd * dot(o, vd) * (min(sp * VEL_SHUTTER * uRate, 0.45) / max(g * s, 1e-3));
}

in vec2 aShard;
out vec3 vWorld;
out vec3 vLocal;
out float vEdge;

SHADERS.shardFrag = /* glsl */`
uniform float uT;
uniform float uIsRefl;
uniform float uRoseOn;
uniform float uSideGlow;     // side walls lit — only once the shards have separated
uniform float uTiled;        // 1 while the shards sit exactly in the monolith (the swaps): shade exactly like the solid
uniform vec3 uMaterial;      // global form mix: x glass, y whale, z iridescence
uniform float uRate;         // the edit's speed (see SHADERS.pull)
in vec3 vWorld;
in vec3 vLocal;
in float vEdge;
#ifdef SHARD_TILED
in vec3 vRest;
in vec3 vBand;
#endif
flat in vec4 vQ;
flat in vec4 vMat;
flat in vec3 vJewel;
flat in float vScale;
flat in float vRnd;
flat in float vRose;
flat in float vSpeed;
layout(location = 0) out vec4 fragColor;
void main() {
  float T = uT * NOMINAL;

  float outer = step(0.5, nL.z), inner = step(nL.z, -0.5), side = 1.0 - outer - inner;
  float e = vEdge, bw = 0.0055 * vScale, bev = 1.0 - uTiled;   // (the solid has no bevel: it fades out while tiled)

  float rim = side > 0.5 ? 1.0 : 1.0 - smoothstep(bw * 0.6, bw * 1.8, e);

  // outer face makes the SAME lavaEmission call as the solid monolith — the exact Voronoi border of the monolith (per
  // pixel, from aBand), the same rest position and heat — so the solid ↔ shard swaps are pixel-identical. Otherwise
  // the rim is a thin cooling line: its glow without the flow noise, and the lean variant carries none of the heavy
  // code (a big uber-shader would cost every shard fragment occupancy). The branches follow the triangle's own face,
  // so derivatives stay well defined within each quad.
  vec3 lava = vec3(0.0);

#ifdef SHARD_TILED
    lava = lavaEmission(vBand.z > 0.5 ? capBorder(vBand.xy) : bandBorder(vBand.xy).x, vRest, T, uLava.x * lf, uLava.y) * lavaThrob(vRest, T);
#else

#endif
  } else if (lf > 0.0 && uLava.z > 0.0) {
    // the broken inner face and the side walls: molten rock cooling through bullet time (yellow → red → dark)
    float n = uLavaQ > 0.5 ? vnoise(vLocal.xy * 110.0 + vRnd * 37.0 + vec2(0.0, T * 0.6)) : 0.5;
    lava = blackbody(uLava.z * lf * (0.78 + 0.45 * (n - 0.5))) * (side > 0.5 ? 0.6 : 0.42);

    float er = side > 0.5 ? 0.5 : exp(-e / (0.004 * vScale + 0.002));
    lava += blackbody(uLava.w * lf * (0.8 + 0.4 * hash12(vec2(vRnd * 91.0, floor(T * 9.0))))) * er * 0.45;   // per-shard flicker

  col += lava;
  col = applyFog(col, vWorld);
  col = min(col, vec3(48.0));
  if (any(isnan(col))) col = vec3(0.0);
  fragColor = vec4(col, 1.0);
}
`;

// ---------------------------------------------------------------- the monolith's Voronoi (solid AND tiled shards)
/* The crack shader inverts world position → band coordinates face by face (aFace), then runs the
   SAME jittered-grid Voronoi as the fracture (identical integer hash) and measures the distance
   to the nearest cell border (two-pass: nearest seed in 3×3, border distance over its 5×5). So
   every glowing crack is exactly an edge between two shards. Tiled shards run the same functions
   on their own band coordinates (aBand), so both sides of a swap see the same distance. */
SHADERS.voronoi = /* glsl */`
uniform vec2 uMonoV[12];
uniform vec2 uMonoI[12];
uniform float uMonoL[12];
uniform vec4 uGrid;       // nx, gx, ny, gy
uniform vec4 uCapGrid;    // ox, oz, g, ncx
uniform float uCapNy;
vec2 bandSeed(int i, int j) {
  int nx = int(uGrid.x + 0.5), iw = ((i % nx) + nx) % nx;
  return vec2((float(i) + 0.1 + 0.8 * hash01(iw, j, 1)) * uGrid.y, (float(j) + 0.1 + 0.8 * hash01(iw, j, 2)) * uGrid.w);
}
vec2 capSeed(int i, int j) { return uCapGrid.xy + (vec2(float(i), float(j)) + 0.1 + 0.8 * vec2(hash01(i, j, 3), hash01(i, j, 4))) * uCapGrid.z; }
// (border distance, a per-edge random number shared by the two cells that meet there)
vec2 bandBorder(vec2 x) {
  int nx = int(uGrid.x + 0.5), ny = int(uGrid.z + 0.5), ci = int(floor(x.x / uGrid.y)), cj = int(floor(x.y / uGrid.w));
  float md = 1e9; vec2 mr = vec2(0.0); ivec2 mc = ivec2(0);
  for (int dj = -1; dj <= 1; dj++) for (int di = -1; di <= 1; di++) {
    int j = cj + dj; if (j < 0 || j >= ny) continue;
    vec2 r = bandSeed(ci + di, j) - x; float d = dot(r, r);
    if (d < md) { md = d; mr = r; mc = ivec2(ci + di, j); }
  }
  float bd = 1e9; ivec2 bc = mc;
  for (int dj = -2; dj <= 2; dj++) for (int di = -2; di <= 2; di++) {
    ivec2 c = mc + ivec2(di, dj); if (c.y < 0 || c.y >= ny || (di == 0 && dj == 0)) continue;
    vec2 r = bandSeed(c.x, c.y) - x;
    float d = dot(0.5 * (mr + r), normalize(r - mr));
    if (d < bd) { bd = d; bc = c; }
  }
  ivec2 a = ivec2(((mc.x % nx) + nx) % nx, mc.y), b = ivec2(((bc.x % nx) + nx) % nx, bc.y);
  ivec2 lo = (a.x < b.x || (a.x == b.x && a.y < b.y)) ? a : b, hi = (lo == a) ? b : a;
  float top = MONO_HB - x.y;
  return bd < top ? vec2(bd, hash01(lo.x * 4096 + lo.y, hi.x * 4096 + hi.y, 7)) : vec2(top, 0.0);
}
float capBorder(vec2 x) {
  int ncx = int(uCapGrid.w + 0.5), ncy = int(uCapNy + 0.5);
  int ci = int(floor((x.x - uCapGrid.x) / uCapGrid.z)), cj = int(floor((x.y - uCapGrid.y) / uCapGrid.z));
  float md = 1e9; vec2 mr = vec2(0.0); ivec2 mc = ivec2(0);
  for (int dj = -1; dj <= 1; dj++) for (int di = -1; di <= 1; di++) {
    ivec2 c = ivec2(ci + di, cj + dj); if (c.x < 0 || c.y < 0 || c.x >= ncx || c.y >= ncy) continue;
    vec2 r = capSeed(c.x, c.y) - x; float d = dot(r, r);
    if (d < md) { md = d; mr = r; mc = c; }
  }
  float bd = 1e9;
  for (int dj = -2; dj <= 2; dj++) for (int di = -2; di <= 2; di++) {
    ivec2 c = mc + ivec2(di, dj); if (c.x < 0 || c.y < 0 || c.x >= ncx || c.y >= ncy || (di == 0 && dj == 0)) continue;
    vec2 r = capSeed(c.x, c.y) - x;
    bd = min(bd, dot(0.5 * (mr + r), normalize(r - mr)));
  }
  for (int k = 0; k < 11; k++) {            // the cap's outline is a seam too
    vec2 a = uMonoI[k], b = uMonoI[k + 1], ab = b - a;
    float t = clamp(dot(x - a, ab) / dot(ab, ab), 0.0, 1.0);
    bd = min(bd, length(x - a - ab * t));
  }
  return bd;
}
`;

// ---------------------------------------------------------------- the lava's state, light and the shared obsidian surface
SHADERS.lava = /* glsl */`
uniform vec4 uLava;          // x crack/seam heat · y crack openness · z molten-interior heat · w ember-rim heat
uniform float uLavaLight;    // the lava's light: a line light on the monolith's axis, intensity = total heat
uniform vec4 uCrack;         // x reveal radius · z hum pulse
// the hum brightens the lava (a multiplier on the emission — it pulses, it doesn't overheat); at 5.0 s its throb
// travels outward from the crack origin as a bright ring
float lavaThrob(vec3 rp, float T) {
  if (uCrack.z <= 0.0) return 1.0;
  float r = 7.0 * max(T - 4.95, 0.0), d = length(rp - CRACK_O) - r;
  return 1.0 + uCrack.z * (0.35 + 0.8 * exp(-d * d * 1.2));
}
// irradiance from a vertical line light spanning the monolith (0‥MONO_H) on its rounded-box footprint. Closed-form
// integrals of the segment for a surface facing it (perp), facing up and facing down, blended by the normal.
vec3 lavaLight(vec3 p, vec3 N) {
  if (uLavaLight <= 0.001) return vec3(0.0);
  vec2 q = max(abs(p.xz) - vec2(1.15, 0.42), 0.0);
  float r = length(q) + 0.3, y0 = p.y, y1 = MONO_H - p.y, r2 = r * r;
  float d0 = sqrt(r2 + y0 * y0), d1 = sqrt(r2 + y1 * y1);
  float perp = (y1 / d1 + y0 / d0) / r, upF = 1.0 / r - 1.0 / d1, downF = 1.0 / r - 1.0 / d0;
  vec3 toL = normalize(vec3(-sign(p.x) * q.x, 0.0, -sign(p.z) * q.y) + vec3(1e-4, 0.0, 0.0));
  float E = max(dot(N, toL), 0.0) * max(perp, 0.0) + max(N.y, 0.0) * max(upF, 0.0) * step(p.y, MONO_H) + max(-N.y, 0.0) * max(downF, 0.0);
  return blackbody(0.72) * (uLavaLight * E * 0.16);
}
// the obsidian surface of the SOLID monolith — tiled shards call it with the same arguments (see uTiled)
vec3 monoSurface(vec3 N, vec3 V, vec3 p, float sh, float rough, float irid, float spinBlur) {
  vec3 col = shadeObsidian(N, V, vec3(0.012, 0.011, 0.013), rough, sh, irid, spinBlur, vec3(1.0));
  col += vec3(0.5, 0.18, 0.08) * uCrack.z * (0.3 + 0.7 * pow(max(1.0 - max(dot(N, V), 0.0), 0.0), 2.0));   // the hum
  if (uLavaQ > 0.5) col += lavaLight(p, N) * 0.12;                                                       // warm pick-up (not on Low)
  return col;
}
`;

// ---------------------------------------------------------------- the solid monolith + its molten cracks
SHADERS.monoVert = /* glsl */`
in float aFace;
out vec3 vWorld;
out vec3 vN;
flat out int vFace;
void main() {

SHADERS.monoFrag = /* glsl */`
uniform float uT;
uniform float uIsRefl;
in vec3 vWorld;
in vec3 vN;
flat in int vFace;
layout(location = 0) out vec4 fragColor;
void main() {
  vec3 N = normalize(vN), V = normalize(cameraPosition - vWorld), p = vWorld;
  float T = uT * NOMINAL;
  // world → band coordinates (exact inverse of Monolith.P)
  vec2 bx; float border, erand = 0.0;
  if (vFace < 22) {
    int k = vFace < 11 ? vFace : vFace - 11;
    vec2 a, b;
    if (vFace < 11) { float kk = 1.0 - (1.0 - MONO_S) * p.y / MONO_H; vec2 q = p.xz / kk; a = uMonoV[k]; b = uMonoV[k + 1]; float f = sat(dot(q - a, b - a) / dot(b - a, b - a)); bx = vec2(uMonoL[k] + f * (uMonoL[k + 1] - uMonoL[k]), p.y); }
    else { float w = sat((p.y - MONO_H) / MONO_CT); a = mix(MONO_S * uMonoV[k], uMonoI[k], w); b = mix(MONO_S * uMonoV[k + 1], uMonoI[k + 1], w); float f = sat(dot(p.xz - a, b - a) / dot(b - a, b - a)); bx = vec2(uMonoL[k] + f * (uMonoL[k + 1] - uMonoL[k]), MONO_H + w * MONO_CTL); }
    vec2 bb = bandBorder(bx); border = bb.x; erand = bb.y;
  } else { bx = vec2(MONO_LP * 0.5, MONO_HB + length(p.xz) * 0.5); border = capBorder(p.xz); }
  // crack reveal: a jagged front spreading from a point low on the broad face. By 5.9 s the network is fully
  // revealed and open and the bright tips are gone, so from then on the emission depends only on
  // (border, rest position, T, uniforms) — exactly what a tiled shard computes.
  vec2 o = vec2(uMonoL[3], 3.6);
  float dxw = mod(bx.x - o.x + MONO_LP * 0.5, MONO_LP) - MONO_LP * 0.5;
  float dist = length(vec2(dxw, bx.y - o.y)) + vnoise(bx * 2.7) * 1.3;
  float since = uCrack.x - dist, tx = since - erand * 1.2;
  float revealed = max(smoothstep(0.0, 0.3, tx), smoothstep(5.55, 5.85, T));
  float openF = max(smoothstep(0.0, 1.8, since), smoothstep(5.5, 5.9, T));
  float tip = exp(-tx * tx * 30.0) * step(0.0, tx) * 0.5 * (1.0 - smoothstep(5.6, 5.9, T));
  float sh = uIsRefl > 0.5 ? 1.0 : shadowAt(p, N);

  col = applyFog(col, p);
  col = min(col, vec3(48.0));

  fragColor = vec4(col, 1.0);
}

/* =====================================================================================
   Story — the beat sheet → uniforms. Every value is a pure function of the story clock
   T = t · 36 (nominal seconds), so scrubbing works in both directions.
   HOW THE LOOP CLOSES. At T → 36 the shards have been locked into the monolith since 33.0 s,
   the solid mesh replaced them at 33.6 s, the re-welded seams have cooled to black by 34.6 s, the ripple
   envelope has settled the water to a perfect mirror by 35.6 s, the sky's cloud field has come
   round its noise circle, and the camera spline has wrapped onto the opening keys — so the
   frame at 36.0 s is the frame at 0.0 s.
   ===================================================================================== */
const Story = {
  init() {
    const ev = [
      // x, z, t0, amp   |   speed, wavenumber, decay, lifetime
      [0, 0, 5.0, 1.6, 11, 1.8, 0.55, 7], [0, 0, 5.15, 0.8, 8, 2.6, 0.7, 6], [0, 0, 6.02, 1.3, 10, 2.0, 0.6, 7], [0, 0, 8.0, 0.7, 6, 1.5, 0.5, 6],
      // burst shards skidding on the mirror at the base
      [1.9, 1.3, 6.07, 0.35, 6, 2.6, 0.9, 3], [-1.8, 1.0, 6.11, 0.3, 6, 2.6, 0.9, 3], [0.4, 2.2, 6.18, 0.3, 6, 2.8, 0.9, 3],
      [5, -9, 12.7, 0.45, 6, 2.2, 0.8, 4], [-5, 4, 13.0, 0.45, 6, 2.2, 0.8, 4], [0, -18.5, 13.4, 0.5, 6, 2.0, 0.8, 4],
      [-12, -3, 20.1, 0.6, 7, 1.6, 0.6, 5],
      [0, 0, 21.0, 0.7, 7, 1.6, 0.55, 5], [0, 0, 22.2, 0.7, 7, 1.6, 0.55, 5], [0, 0, 23.4, 0.7, 7, 1.6, 0.55, 5], [0, 0, 24.6, 0.7, 7, 1.6, 0.55, 5],
      [0, 0, 26.1, 1.2, 9, 1.7, 0.5, 6], [0, 0, 29.1, 0.9, 14, 1.9, 0.6, 5], [0, 0, 31.2, 0.6, 8, 2.1, 0.7, 4], [0, 0, 33.0, 1.0, 9, 2.0, 0.9, 3.5],
    ];
    const p = V3();
    for (let i = 11; i < 16; i++) { Whale.path(ev[i][2], p); ev[i][0] = p.x; ev[i][1] = p.z; }   // the whale's wake and its breach
    this.coreRipples = ev.length;
    // skim wakes (3.1): sample the whale's extremities in JS (the mirror of SHADERS.whale); wherever a fin tip or fluke
    // passes within 1.25 m of the mirror, drop a ring under it every 0.12 s — rings from a moving source draw a V-wake
    const wakes = [];
    if (CONFIG.features.skimWakes) {

        if (!/fin tip|fluke/.test(tip.name)) continue;
        let last = -1;
        for (let T = 20.6; T < 27.5; T += 0.02) {
          Whale.world(tip.p, tip.s, tip.part, tip.span, T, p);

        }

    }
    const free = 32 - ev.length, pickW = wakes.length <= free ? wakes : Array.from({ length: free }, (_, i) => wakes[Math.floor(((i + 0.5) * wakes.length) / free)]);
    this.wakes = pickW;

    this.allRipples = this.events.length; this.rippleLimit = this.allRipples;
  },
  // only the ring events alive at T go to the flat shader (compacted to the front), so its loop runs over a handful
  // instead of all 32 slots; Low leaves the skim wakes out (rippleLimit)
  ripples(T) {
    const ev = this.events, R = U.uRipple.value, RB = U.uRippleB.value;
    let k = 0;
    for (let i = 0; i < this.rippleLimit; i++) {
      const e = ev[i], age = T - e[2];

    }
    U.uRippleN.value = k;
  },
  // bullet time: a remap of local time inside the shatter window (the global clock never slows)
  // real speed 1 → 0.06 over 0.16–0.36 s after the shatter, frozen-ish until 1.2 s, back to 1 by 1.5 s
  bulletTime(tau) {
    if (tau <= 0) return 0;
    const a = 0.16, b = 0.36, c = 1.2, d = 1.5, v = 0.06;
    if (tau < a) return tau;
    let e = a;
    if (tau < b) { const x = tau - a; return e + x - (0.5 * (1 - v) * x * x) / (b - a); }
    e += ((b - a) * (1 + v)) / 2;
    if (tau < c) return e + (tau - b) * v;
    e += (c - b) * v;
    if (tau < d) { const x = tau - c; return e + v * x + (0.5 * (1 - v) * x * x) / (d - c); }

  },
  slowness(tau) { return tau <= 0.16 || tau >= 1.5 ? 0 : tau < 0.36 ? (tau - 0.16) / 0.2 : tau < 1.2 ? 1 : 1 - (tau - 1.2) / 0.3; },
  // the lava's state at story time T (2.1–2.4): crack/seam heat, openness, molten interiors, lingering ember rims
  lava(T, te, out) {
    // the pre-shatter flash: the cracks run yellow-hot. Kept low — by now the open crack lines cover most of the face, so
    // a higher peak turns the whole slab into a blown-out white column (0.6 did: 30 % of the frame clipped white)
    const pre = smoothstep(5.72, 5.98, T), flash = RM_SOFT ? 0.1 : 0.18;
    let heat = 0, open = 0, interior = 0, ember = 0;
    if (T >= 3.5 && T < 6.0) { heat = mix(0.3, 0.6, smoothstep(3.5, 5.6, T)) + flash * pre; open = smoothstep(3.6, 5.5, T); }
    else if (T >= 6.0 && T < 12.45) {             // after the burst everything cools with bullet time
      heat = (0.6 + flash) * Math.exp(-te * 6.0); open = 1;
      interior = 0.8 * Math.exp(-te * 2.3); ember = 0.3 * Math.exp(-te / 2.6) * smoothstep(0, 0.08, te);
    } else if (T >= 27.5 && T < 28.6) heat = (RM_SOFT ? 0.25 : 0.5) * Math.exp(-(T - 27.5) * 5.0);   // the breach flashes along its seams
    else if (T >= 32.2 && T < 34.8) {              // the return re-welds: seams heat as the shards lock, then cool yellow → red → black
      heat = 0.78 * smoothstep(32.2, 33.0, T) * Math.pow(1 - smoothstep(33.25, 34.6, T), 1.6);
      open = 0.32 * (1 - smoothstep(32.6, 34.0, T)); interior = heat;

  apply(t, meshes) {

    const hum = 0.8 * window01(T, 4.85, 5.0, 5.2, 5.9) + 0.45 * window01(T, 32.8, 33.2, 33.6, 34.4);
    u.uCrack.value.set(reveal, 0, hum, 0);

    u.uBulletTime.value = te;
    u.uBulletTimePrev.value = Tp >= B('shatter') ? this.bulletTime(Tp - B('shatter')) : 0;
    u.uBulletRate.value = T > 6 && T < 7.6 ? 1 - 0.94 * this.slowness(T - 6) : 1;
    // the lava, its light, and whether the shards still sit exactly in the monolith (the swaps)
    const lv = this.lava(T, te, u.uLava.value);
    u.uLavaLight.value = T >= 27.5 && T < 30 ? 0 : lv.x * (0.4 + 0.6 * lv.y) + lv.z * 0.5;
    // (the shards are all locked by 33.0 s; the exact-border SHARD_TILED variant only runs for the last 0.2 s before the fuse)
    u.uTiled.value = T < 12.45 ? 1 - smoothstep(0.0, 0.05, te) : smoothstep(33.35, 33.55, T);
    // how far the shards have separated from the tiled monolith (their side walls are hidden while tiled)
    u.uSideGlow.value = T < 12.45 ? smoothstep(0.0, 0.07, te) : 1 - smoothstep(32.9, 33.3, T);
    const cath = window01(T, 14.0, 15.0, 17.6, 18.8), whale = window01(T, 20.4, 21.4, 27.4, 27.6);
    u.uForm.value.set(T < 6.02 || T > 33.0 ? 1 : 0, cath, whale, 0);
    u.uMaterial.value.set(cath, whale, T * 0.03);
    u.uRoseOn.value = window01(T, 14.6, 15.3, 17.7, 18.3);
    u.uRippleAmp.value = window01(T, 1.1, 1.9, 34.2, 35.6);
    this.ripples(T);
    u.uWind.value.set(1.0 * window01(T, 1.6, 2.1, 3.6, 5.2), 0.22 * window01(T, 2.5, 4.0, 32.0, 34.5), 0);
    u.uSpiral.value = window01(T, 28.8, 29.3, 31.0, 32.2);
    // whale capsule (analytic shadow on Low) — it follows the clearance-aware pitch
    if (whale > 0) { const c = Whale.path(T, this._c); Whale.frame(T, this._f, this._u, this._r); u.uWhaleA.value.copy(c).addScaledVector(this._f, 11); u.uWhaleB.value.copy(c).addScaledVector(this._f, -12); }
    // the swap between the solid monolith and the shard cloud
    const shards = T >= B('shatter') && T < B('fuse');
    meshes.solid.visible = !shards; meshes.shards.visible = shards;
    ShardSystem.pickMaterial();
    meshes.embers.visible = Embers.count > 0 && T > 4.55 && T < 9.8;
    // the heat haze (2.5) and the rose shafts (3.3) run only inside their windows
    const tier = meshes.tier;
    const hz = tier.haze && !RM_SOFT ? window01(T, 3.5, 4.6, 6.4, 7.0) + window01(T, 32.5, 33.1, 33.9, 34.5) * 0.7 : 0;
    PostFX.haze.enabled = hz > 0.002; PostFX.haze.maskU.uHaze.value = hz;
    const rs = CONFIG.features.roseShafts && tier.roseSteps > 0 ? u.uRoseOn.value * window01(T, 14.9, 15.4, 17.3, 17.9) : 0;
    PostFX.rose.enabled = rs > 0.002; PostFX.rose.sMat.uniforms.uStrength.value = rs * 0.0035;

    if (T < 12.45 || T >= 30.6) Lighting.aim(this._v.set(0, T > 7.4 && T < 12.45 ? 10 : 5, 0), T > 7.4 && T < 12.45 ? 24 : 16);
    else if (T < 19.6) Lighting.aim(this._v.set(0, 12, -2), 34);
    else if (T < 27.6) Lighting.aim(Whale.path(Math.min(T, 27.5), this._v), 24);
    else Lighting.aim(this._v.set(0, 3, 0), 34);
    return T;
  },
  _v: V3(), _c: V3(), _f: V3(), _u: V3(), _r: V3(),
};

/* =====================================================================================
   Audio — Web Audio only, fully synthesized, off until the user taps. Original material in
   D minor, resolving to D major as the monolith fuses. One-shots fire as the real clock
   crosses their place in the edit (forward playback only); beds follow the story clock continuously.
   ===================================================================================== */
const midi = (n) => 440 * Math.pow(2, (n - 69) / 12);

    const bed = (type, freq, q, sendAmt = 0) => {
      const s = ctx.createBufferSource(); s.buffer = this.noise; s.loop = true;
      const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
      const p = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
      const g = ctx.createGain(); g.gain.value = 0; s.connect(f); f.connect(g);
      if (p) { g.connect(p); p.connect(this.master); } else g.connect(this.master);
      if (sendAmt) { const sg = ctx.createGain(); sg.gain.value = sendAmt; g.connect(sg); sg.connect(this.send); }
      s.start(); return { g, f, p };
    };
    this.wind = bed('bandpass', 700, 0.5, 0.2);
    this.swirl = bed('bandpass', 900, 2.2, 0.3);
    this.rainBed = bed('highpass', 5200, 0.7, 0.4);
    // the lava bed: a low rumble, a high sizzle, and crackle whose density follows the heat (two sparse impulse beds)
    this.rumble = bed('lowpass', 95, 0.9, 0.1);
    this.sizzle = bed('highpass', 6800, 0.5, 0.15);
    const crackleBuf = (rate) => {
      const b = ctx.createBuffer(1, sr * 2, sr), d = b.getChannelData(0), n = Math.round(rate * 2);
      for (let k = 0; k < n; k++) {

        for (let i = 0; i < len; i++) d[at + i] += (r.next() * 2 - 1) * amp * Math.exp(-i / (len * 0.25));
      }

    };

      const s = ctx.createBufferSource(); s.buffer = crackleBuf(rate); s.loop = true;
      const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.9;
      const g = ctx.createGain(); g.gain.value = 0; s.connect(f); f.connect(g); g.connect(this.master);

/* =====================================================================================
   main loop
   The master clock is the real cycle position t ∈ [0, 1); T = Edit.story(t) is the nominal story clock and
   Edit.rate(t) its speed (uRate: motion blur, glint smear and aberration are per real second).
   Per frame the CPU only evaluates the story (uniforms) and the camera (at T and T − 1/60), then renders:
     1 state pass (MRT)   2 on-screen motion (1×1)   3 mirror (shard + ember subset)   4 shadow map + scene
     5 post chain (god rays, rose shafts, heat haze, bloom, DOF, grade, output)

   ===================================================================================== */

  renderer.info.autoReset = false;

  const probed = QualityManager.probe(renderer), tierKey = CAPTURE ? 'high' : forced || probed, tier = CONFIG.tiers[tierKey];   // capture locks High
  renderer.setPixelRatio(QualityManager.targetPR(tier)); renderer.setSize(Math.max(1, window.innerWidth), Math.max(1, window.innerHeight), false);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.05, 8000);
  camera.layers.enable(1);
  const prevCam = new THREE.Object3D();     // the camera at T − 1/60 (velocity, on-screen motion)
  const rng = new RNG(CONFIG.seed);
  Monolith.init(); Whale.init(); Story.init();

  await step(0.58, 'Painting the sunset…', () => { Environment.build(renderer, scene); Lighting.build(scene); });

  const director = new CameraDirector(SHOTS);
  const meshes = { solid: ShardSystem.solid, shards: ShardSystem.mesh, embers: Embers.mesh, tier };

  const app = {
    renderer, camera, scene, tier, meshes, pr: renderer.getPixelRatio(), bundles: { [tierKey]: firstBundle }, buildBundle,
    t: 0, T: 0, forceT: null, playing: true, speed: 1, scrubbing: false, soundOn: false,
    lost: false, capturing: false, checking: false, capSize: null, driftK: 1, forceSwap: null, vw: 1, vh: 1,
    // the free camera: on while the viewer holds it; back < 1 while it eases back into the film; focus follows the action
    free: { on: false, back: 1, fov: 40, focus: V3(), pos: V3(), tgt: V3() },
    resize() {

    togglePlay() { app.playing = !app.playing; ui.setPlaying(app.playing); ui.wake(); },
    cycleSpeed() { const order = [1, 1.5, 0.5]; app.speed = order[(order.indexOf(app.speed) + 1) % order.length]; ui.setSpeed(app.speed); },
    cycleQuality() { if (CAPTURE) return; const order = ['low', 'medium', 'high']; QualityManager.apply(order[(order.indexOf(app.tier.key) + 1) % 3]); },
    async toggleSound(force) { const on = force === true ? true : !app.soundOn; app.soundOn = on; ui.setSound(on); await audio.setEnabled(on); },
    scrubTo(t) { app.t = clamp(t, 0, 0.99999); },
    scrubBy(d) { app.t = (((app.t + d) % 1) + 1) % 1; },

  app.orbit = orbit;
  let lastFov = 40;
  // where the action is, for the free camera to follow: the site (lifting with the vortex and the cathedral), then the
  // whale's body while it flies, then back to the site for the return
  const siteY = (T) => 4.5 + Math.max(5 * window01(T, 7.0, 9.0, 12.45, 13.5), 6.5 * window01(T, 12.0, 14.0, 18.5, 20.5));
  const focusAt = (T, out) => {
    out.set(0, siteY(T), -2 * window01(T, 12.0, 14.0, 18.5, 20.5));
    const w = window01(T, 19.6, 20.4, 27.6, 29.0);
    if (w > 0) { Whale.camRef(clamp(T, 20.0, 27.6), focusTmp); out.lerp(focusTmp, w); }
    return out;
  };
  const focusTmp = V3(), focusNow = V3();
  const ui = new UI(app); app.ui = ui; ui.hudH = ui.hud.offsetHeight + 20;
  const audio = new AudioEngine(); audio.buildEvents();
  ui.setSpeed(1); ui.setPlaying(true); ui.setSound(false);
  QualityManager.init(app); await QualityManager.apply(tierKey);
  let last = performance.now();
  window.addEventListener('resize', () => { app.pr = QualityManager.targetPR(app.tier); app.resize(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) audio.suspend(); else { audio.resume(); last = performance.now(); } });

  // ---- a lost WebGL context pauses the film; on restore three rebuilds its GL state lazily (programs, buffers, render
  // targets), and what was RENDERED into textures is recreated here — the PMREM environment — while every DataTexture
  // re-uploads from its cached CPU array. Nothing is re-fractured.
  const lostEl = document.getElementById('ctxlost');
  canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); app.lost = true; lostEl.classList.add('on'); audio.suspend(); });
  canvas.addEventListener('webglcontextrestored', () => {
    Environment.buildEnv(renderer);
    for (const b of Object.values(app.bundles)) for (const tx of ShardSystem.textures(b)) tx.needsUpdate = true;
    ShardSystem.tiledValid = false;
    Lighting.placeholder.needsUpdate = true;
    renderer.shadowMap.enabled = app.tier.shadow > 0;
    app.lost = false; lostEl.classList.remove('on'); audio.resume(); last = performance.now();
  });

  const camPos = V3(), camTgt = V3(), prevPos = V3(), prevTgt = V3(), sunW = V3(), look = V3(), side = V3(), upv = V3();
  const vpNow = new THREE.Matrix4(), vpPrev = new THREE.Matrix4();
  const HW = (2 * Math.PI) / NOMINAL;     // handheld drift: integer harmonics of the cycle → periodic, reproducible

    const a = dist * 0.004 * (REDUCED_MOTION ? 0.3 : 1) * app.driftK;

    if (app.size !== window.innerWidth + 'x' + window.innerHeight) { app.pr = QualityManager.targetPR(app.tier); app.resize(); }   // resize events can be missed while hidden
    QualityManager.adapt(dtMs, now);
    if (app.playing && !app.scrubbing) app.t = (app.t + (dt * app.speed) / CONFIG.cycleDuration) % 1;
    // the edit: the real cycle position → the story clock, and its local speed (debug hooks can pin a story second)
    const pinned = app.forceT !== null, T = Story.apply((pinned ? app.forceT : Edit.story(app.t)) / NOMINAL, meshes);
    app.T = T;
    U.uRate.value = (pinned ? 1 : Edit.rate(app.t)) * app.speed;
    U.uBulletRate.value *= U.uRate.value;                    // (ember streaks: a real shutter's worth of travel)

    // ---- camera: the shot list, a slow handheld drift (a function of T), and the viewer's parallax peek. The shot's
    // own position (before drift) feeds the state pass's camera bubble; the camera at T − 1/60 feeds the velocity pass
    // and the on-screen motion (at a cut both are the current camera). The free camera replaces all of this while the
    // viewer holds it, and eases back into it when they let go.

    let shotFov = shot.fov;
    lastFov = shotFov;
    U.uCamPos.value.copy(camPos);
    const Tp = T - VEL_DT, cut = (Tp < B('shatter') && T >= B('shatter')) || (Tp < B('emerge') && T >= B('emerge'));
    const Tq = cut ? T : (Tp + NOMINAL) % NOMINAL;
    director.evaluate(Tq, prevPos, prevTgt);
    U.uCamPosPrev.value.copy(prevPos);
    const dist = camPos.distanceTo(camTgt);

    camPos.y = Math.max(camPos.y, 0.35); prevPos.y = Math.max(prevPos.y, 0.35);

    ShardSystem.update(renderer);

      PostFX.motion(renderer, vpNow, vpPrev, ShardSystem.bundle.count);

    } else g.uCAFixed.value = cut ? 0 : clamp((camPos.distanceTo(prevPos) / VEL_DT * U.uRate.value - 6) / 20, 0, 1) * (REDUCED_MOTION ? 0.4 : 1);   // Low: camera speed

      ui.dbg.textContent = `FPS ${fpsEma.toFixed(0)}  ·  ${QualityManager.ema.toFixed(1)} ms\n` +

        `Shards ${b.count}  ·  mirror subset ${Math.round(app.tier.reflSubset * 100)}%  ·  ripples ${U.uRippleN.value} / ${Story.rippleLimit}\n` +
